<svg xmlns="http://www.w3.org/2000/svg" width="900" height="24" viewBox="0 0 900 24" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9a3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#00d9a3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9a3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00d9a3" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#00d9a3" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="0" y="11" width="900" height="2" fill="url(#base)"/>
  <rect x="-200" y="10.5" width="200" height="3" fill="url(#beam)" filter="url(#glow)">
    <animate attributeName="x" values="-200;900" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="442" y="6" width="12" height="12" fill="#0d1117" stroke="#00d9a3" stroke-width="1.5" transform="rotate(45 448 12)" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </rect>
</svg>
