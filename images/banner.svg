<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M35 0H0V35" fill="none" stroke="#00d9a3" stroke-opacity="0.05"/>
    </pattern>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.18"/>
    </pattern>
    <radialGradient id="glowbg" cx="0.75" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#006450" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00d9a3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00d9a3" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00d9a3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9a3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00d9a3"/>
      <stop offset="1" stop-color="#00d9a3" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="band1"><rect x="0" y="118" width="900" height="18"/></clipPath>
    <clipPath id="band2"><rect x="0" y="148" width="900" height="12"/></clipPath>
    <clipPath id="type">
      <rect x="130" y="196" width="0" height="30">
        <animate attributeName="width" values="0;640;640;0" keyTimes="0;0.4;0.9;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    text { font-family: 'Share Tech Mono','Courier New',Courier,monospace; }
    .title { font-family: Orbitron,'Arial Black','Segoe UI',Verdana,sans-serif; font-weight: 900; font-size: 84px; letter-spacing: 8px; }
    .sub { font-size: 19px; letter-spacing: 5px; }
    .tag { font-size: 11px; letter-spacing: 3px; }
    .g1 { animation: g1 4s infinite; }
    .g2 { animation: g2 4s infinite; }
    .blink { animation: blink 1s infinite steps(1); }
    @keyframes g1 {
      0%,88%,100% { transform: translate(0,0); opacity: 0; }
      89% { transform: translate(-7px,2px); opacity: 1; }
      91% { transform: translate(6px,-2px); opacity: 1; }
      93% { transform: translate(0,0); opacity: 0; }
    }
    @keyframes g2 {
      0%,87%,100% { transform: translate(0,0); opacity: 0; }
      88% { transform: translate(7px,-2px); opacity: .45; }
      90% { transform: translate(-6px,2px); opacity: .45; }
      92% { transform: translate(0,0); opacity: 0; }
    }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  </style>

  <rect width="900" height="300" fill="#0d1117"/>
  <rect width="900" height="300" fill="url(#grid)"/>
  <rect width="900" height="300" fill="url(#glowbg)"/>

  <rect width="900" height="60" fill="url(#scan)">
    <animateTransform attributeName="transform" type="translate" values="0,-60;0,300" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- corner brackets -->
  <g fill="none" stroke="#00d9a3" stroke-width="2" stroke-opacity="0.6">
    <path d="M18 46V18H46"/><path d="M854 18H882V46"/>
    <path d="M18 254V282H46"/><path d="M854 282H882V254"/>
  </g>

  <!-- HUD -->
  <text x="40" y="44" class="tag" fill="#00d9a3" fill-opacity="0.55">// DEV</text>
  <text x="860" y="44" class="tag" fill="#00d9a3" fill-opacity="0.55" text-anchor="end">ONLINE</text>
  <circle cx="872" cy="40" r="3.5" fill="#00d9a3" style="filter:drop-shadow(0 0 4px #00d9a3)">
    <animate attributeName="opacity" values="1;0.1;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- glitch slices -->
  <g clip-path="url(#band1)"><text class="title g1" x="450" y="165" text-anchor="middle" fill="#00d9a3">DANLOANS</text></g>
  <g clip-path="url(#band2)"><text class="title g2" x="450" y="165" text-anchor="middle" fill="#e6edf3">DANLOANS</text></g>
  <!-- main title -->
  <text class="title" x="450" y="165" text-anchor="middle" fill="#e6edf3">DANLOANS</text>

  <rect x="130" y="180" width="640" height="2" fill="url(#bar)"/>

  <!-- typed subtitle -->
  <g clip-path="url(#type)">
    <text class="sub" x="450" y="214" text-anchor="middle" fill="#00d9a3">ROBLOX DEV  ·  DISCORD BOT MAKER</text>
  </g>
  <text class="sub blink" x="772" y="214" fill="#00d9a3">_</text>

  <!-- bottom HUD -->
  <rect x="40" y="262" width="260" height="2" fill="#00d9a3" fill-opacity="0.12"/>
  <rect x="40" y="262" width="0" height="2" fill="#00d9a3">
    <animate attributeName="width" values="0;260;260" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="40" y="282" class="tag" fill="#00d9a3" fill-opacity="0.4">SYS::DANLOANS_V2.0</text>
  <text x="860" y="282" class="tag" fill="#00d9a3" fill-opacity="0.4" text-anchor="end">[ ALL SYSTEMS ONLINE ]</text>

  <rect width="900" height="300" fill="url(#lines)"/>
</svg>
