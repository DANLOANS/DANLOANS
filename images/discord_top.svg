<svg xmlns="http://www.w3.org/2000/svg" width="500" height="38" viewBox="0 0 500 38" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity="0.18"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: 'Share Tech Mono','Courier New',Courier,monospace; letter-spacing: 3px; }
    .bl { animation: bl 1.4s infinite; }
    @keyframes bl { 0%,100% { opacity: 1; } 50% { opacity: .15; } }
  </style>
  <rect x="1" y="1" width="498" height="36" fill="#161b22" stroke="#00d9a3" stroke-opacity="0.45" stroke-width="1.5"/>
  <circle cx="22" cy="19" r="5" fill="#005c45"/>
  <circle cx="40" cy="19" r="5" fill="#00b386"/>
  <circle cx="58" cy="19" r="5" fill="#00d9a3"/>
  <text x="250" y="23" text-anchor="middle" font-size="12" fill="#00d9a3" fill-opacity="0.6">// DISCORD.STATUS</text>
  <text x="468" y="23" text-anchor="end" font-size="11" fill="#00d9a3" fill-opacity="0.5">LIVE</text>
  <circle class="bl" cx="480" cy="19" r="3.5" fill="#00d9a3" filter="url(#glow)"/>
  <rect x="1" y="1" width="498" height="36" fill="url(#lines)"/>
</svg>