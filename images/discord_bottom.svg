  <text x="14" y="17" font-size="10" fill="#00d9a3" fill-opacity="0.45">SYS::DISCORD.GATEWAY</text>
  <text x="486" y="17" text-anchor="end" font-size="10" fill="#00d9a3" fill-opacity="0.45">[ CONNECTED ]</text>
  <g clip-path="url(#c)">
