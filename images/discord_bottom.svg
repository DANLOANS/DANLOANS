<svg xmlns="http://www.w3.org/2000/svg" width="500" height="26" viewBox="0 0 500 26" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
